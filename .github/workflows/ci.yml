name: CI

on:
  push:
    branches: [main, towards-v3]
  pull_request:
  release:

jobs:
  smoke:
    name: smoke-py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (base extras)
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Smoke tests
        run: pytest tests/ -v

  mypy:
    name: mypy-py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      - name: Type check
        run: mypy licsbas/

  viewer:
    name: viewer-py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gmt
      - name: Install (viewer extras)
        run: |
          python -m pip install --upgrade pip
          pip install .[viewer] pytest
      - name: Tests
        run: |
          pytest tests/ -v
          python -c "from licsbas.extras import pygmt_plot_interactive; print('pygmt viewer OK')"
          python -c "from licsbas.extras_light import pylight_plot_interactive; print('light viewer OK')"
