name: licsbas
channels:
  - conda-forge
dependencies:
  - shapely
  - rioxarray
  - networkx
  - pygmt
  - ipympl
  - usgs-libcomcat
  # liCSBAS core (pip, from repo root) + interactive viewer (pygmt + ipympl).
  # The GMT binary needed by pygmt is installed via apt.txt.
  - pip:
    - ".[unwrap,viewer]"
    - contextily