licsbas-unwrap = "licsbas.steps._02to05_unwrap:main"
licsbas-era5 = "licsbas.steps._03op_era5:main"
licsbas-gacos = "licsbas.steps._03op_gacos:main"
licsbas-mask-unw = "licsbas.steps._04op_mask_unw:main"
licsbas-clip-unw = "licsbas.steps._05op_clip_unw:main"
licsbas-check-unw = "licsbas.steps._11_check_unw:main"
licsbas-choose-reference = "licsbas.steps._120_choose_reference:main"
licsbas-loop-closure = "licsbas.steps._12_loop_closure:main"
licsbas-sb-inv = "licsbas.steps._130_sb_inv:main"
licsbas-boi-absolute = "licsbas.steps._131_boi_absolute:main"
licsbas-bovl2abs = "licsbas.steps._131_bovl2abs:main"
licsbas-corrections = "licsbas.steps._131_corrections:main"
licsbas-residual-threshold = "licsbas.steps._131_residual_threshold:main"
licsbas-unwrapping-correction = "licsbas.steps._132_unwrapping_correction:main"
licsbas-write-h5 = "licsbas.steps._133_write_h5:main"
