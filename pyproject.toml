[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "LiCSBAS"
version = "3.0.0rc1"
description = "InSAR time series analysis based on LiCSAR products (COMET LiCSBAS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Milan Lazecky" },
    { name = "Muhammet Nergizci" },
    { name = "Yu Morishita" },
    { name = "COMET Team" },
]
maintainers = [
    { name = "COMET Team", email = "M.Lazecky@leeds.ac.uk" },
]
keywords = ["InSAR", "LiCSAR", "time series", "displacement", "geodesy"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "astropy",
    "beautifulsoup4",
    "h5py",
    "matplotlib",
    "networkx",
    "numpy>=1.24",
    "pandas",
    "Pillow",
    "psutil",
    "requests",
    "rioxarray",
    "scikit-learn",
    "seaborn",
    "scipy",
    "shapely",
    "statsmodels",
    "utm",
    "xarray",
    "cmcrameri",
    "ipympl",
    "pygmt"
]

[project.optional-dependencies]
# licsar_extra: required for GPU unwrapping (step 02to05), corrections (step 131)
# and the azimuth-offset steps (LiCSBAS131_boi_absolute / LiCSBAS131_bovl2abs)
unwrap = [
    "licsar_extra @ git+https://github.com/comet-licsar/licsar_extra",
]
# usgs-libcomcat: only for LiCSBAS_get_eqoffsets.py
comcat = [
    "usgs-libcomcat",
]
all = [
    "licsar_extra @ git+https://github.com/comet-licsar/licsar_extra",
    "usgs-libcomcat",
]

[project.urls]
Homepage = "https://github.com/comet-licsar/LiCSBAS"
Documentation = "https://github.com/yumorishita/LiCSBAS/wiki"
Issues = "https://github.com/comet-licsar/LiCSBAS/issues"

