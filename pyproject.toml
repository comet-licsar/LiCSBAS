[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "LiCSBAS"
version = "1.15.1"
description = "InSAR time series analysis based on LiCSAR products (COMET LiCSBAS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Yu Morishita" },
    { name = "COMET Team" },
]
maintainers = [
    { name = "COMET Team", email = "espiritocz@gmail.com" },
]
keywords = ["InSAR", "LiCSAR", "time series", "displacement", "geodesy"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "astropy",
    "beautifulsoup4",
    "h5py",
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "Pillow",
    "psutil",
    "requests",
    "rioxarray",
    "scipy",
    "shapely",
    "statsmodels",
    "xarray",
    # colormaps
    "cmcrameri",
    # interactive plotting (notebooks)
    "ipympl",
    "pygmt",
]

[project.optional-dependencies]
# licsar_extra: required for GPU unwrapping (step 02to05) and corrections (step 131)
unwrap = [
    "licsar_extra @ git+https://github.com/comet-licsar/licsar_extra",
]
# usgs-libcomcat: only for LiCSBAS_get_eqoffsets.py
comcat = [
    "usgs-libcomcat",
]
all = [
    "licsar_extra @ git+https://github.com/comet-licsar/licsar_extra",
    "usgs-libcomcat",
]

[project.urls]
Homepage = "https://github.com/comet-licsar/LiCSBAS"
Documentation = "https://github.com/yumorishita/LiCSBAS/wiki"
Issues = "https://github.com/comet-licsar/LiCSBAS/issues"

[tool.setuptools]
# LiCSBAS_lib contains the library modules. Historically they were used as
# top-level modules (e.g. `import LiCSBAS_tools_lib`), made available by adding
# LiCSBAS_lib to PYTHONPATH (see bashrc_LiCSBAS.sh). Keep that convention so
# existing scripts and notebooks keep working after `pip install .`.
package-dir = { "" = "LiCSBAS_lib" }
py-modules = [
    "LiCSBAS_extras",
    "LiCSBAS_inv_lib",
    "LiCSBAS_io_lib",
    "LiCSBAS_loop_lib",
    "LiCSBAS_meta",
    "LiCSBAS_plot_lib",
    "LiCSBAS_tools_lib",
]

[tool.setuptools.packages.find]
where = ["LiCSBAS_lib"]

# colormap data files shipped next to the colormap packages
[tool.setuptools.package-data]
cmocean = ["**/*.txt", "*.pdf"]
SCM = ["**/*.txt", "*.pdf"]
GMT = ["**/*.txt", "*.pdf"]
backup_colorcet = ["*.csv"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc"]
