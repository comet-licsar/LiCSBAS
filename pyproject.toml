# bundled colormap data + extraction scripts
[tool.setuptools.package-data]
"licsbas" = ["colormaps/*.sh"]
"licsbas.colormaps.cmocean" = ["**/*.txt", "*.pdf"]
"licsbas.colormaps.SCM" = ["**/*.txt", "*.pdf"]
"licsbas.colormaps.GMT" = ["**/*.txt", "*.pdf"]
"licsbas.colormaps.backup_colorcet" = ["*.csv"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc"]
