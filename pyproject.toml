[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licsbas"
version = "3.0.0"
description = "InSAR time series analysis using LiCSAR products (COMET-LiCSBAS)"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
authors = [
    {name = "Milan Lazecky", email = "milan.lazecky@leeds.ac.uk"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "statsmodels",
    "rasterio",
    "xarray",
    "rioxarray",
    "matplotlib",
    "astropy",
    "shapely",
    "geopandas",
    "pandas",
    "pyproj>=3.4",
    "requests",
    "h5py",
    "cmcrameri",
    "psutil",
    "beautifulsoup4",
    "python-dateutil",
    "utm",
]

[project.optional-dependencies]
# Interferogram unwrapping tools (SNAPHU binary pulled in via licsar_extra)
unwrap = [
    "licsar-extra @ git+https://github.com/comet-licsar/licsar_extra.git@v1.6",
]
# Network / auxiliary plotting helpers (LiCSBAS120 networks, ERA5 plots, tools_lib)
plot = [
    "networkx",
    "seaborn",
]
# Machine-learning based corrections (RANSAC in LiCSBAS131_boi_absolute / bovl2abs)
ml = [
    "scikit-learn",
]
# Interactive viewers (pygmt map viewer + ipympl notebook widgets + contextily basemaps)
viewer = [
    "pygmt",
    "ipympl",
    "contextily",
    "Pillow",
]
all = [
    "licsbas[unwrap,plot,ml,viewer]",
]

[project.urls]
Homepage = "https://github.com/comet-licsar/LiCSBAS"
Documentation = "https://comet-licsar.github.io/LiCSBAS/"
Changelog = "https://github.com/comet-licsar/LiCSBAS/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/comet-licsar/LiCSBAS/issues"

[project.scripts]
licsbas-batch = "licsbas.batch:main"
# Main pipeline steps (legacy names)
licsbas-01-get-geotiff = "licsbas.steps._01_get_geotiff:main"
licsbas-02-ml-prep = "licsbas.steps._02_ml_prep:main"
licsbas-02to05-unwrap = "licsbas.steps._02to05_unwrap:main"
licsbas-03op-era5 = "licsbas.steps._03op_era5:main"
licsbas-03op-gacos = "licsbas.steps._03op_gacos:main"
licsbas-04op-mask-unw = "licsbas.steps._04op_mask_unw:main"
licsbas-05op-clip-unw = "licsbas.steps._05op_clip_unw:main"
licsbas-11-check-unw = "licsbas.steps._11_check_unw:main"
licsbas-120-choose-reference = "licsbas.steps._120_choose_reference:main"
licsbas-12-loop-closure = "licsbas.steps._12_loop_closure:main"
licsbas-130-sb-inv = "licsbas.steps._130_sb_inv:main"
licsbas-131-boi-absolute = "licsbas.steps._131_boi_absolute:main"
licsbas-131-bovl2abs = "licsbas.steps._131_bovl2abs:main"
licsbas-131-corrections = "licsbas.steps._131_corrections:main"
licsbas-131-residual-threshold = "licsbas.steps._131_residual_threshold:main"
licsbas-132-unwrapping-correction = "licsbas.steps._132_unwrapping_correction:main"
licsbas-133-write-h5 = "licsbas.steps._133_write_h5:main"
licsbas-14-vel-std = "licsbas.steps._14_vel_std:main"
licsbas-15-mask-ts = "licsbas.steps._15_mask_ts:main"
licsbas-16-filt-ts = "licsbas.steps._16_filt_ts:main"
licsbas-17-plot-corrections = "licsbas.steps._17_plot_corrections:main"
# Auxiliary / utility tools
licsbas-cum2vel = "licsbas.steps._cum2vel:main"
licsbas-cum2vel-weighted = "licsbas.steps._cum2vel_weighted:main"
licsbas-plot-ts = "licsbas.steps._plot_ts:main"
licsbas-color-geotiff = "licsbas.steps._color_geotiff:main"
licsbas-color-geotiff2tiles = "licsbas.steps._color_geotiff2tiles:main"
licsbas-disp-img = "licsbas.steps._disp_img:main"
licsbas-contour = "licsbas.steps._contour:main"
licsbas-cum2tstxt = "licsbas.steps._cum2tstxt:main"
licsbas-get-value-geo = "licsbas.steps._get_value_geo:main"
licsbas-epochs2cum = "licsbas.steps._epochs2cum:main"
licsbas-get-geotiff-alos = "licsbas.steps._01_get_geotiff_alos:main"
licsbas-plot-network = "licsbas.steps._plot_network:main"
licsbas-densify-ifgs = "licsbas.steps._densify_ifgs:main"
licsbas-flt2geotiff = "licsbas.steps._flt2geotiff:main"
licsbas-get-eqoffsets = "licsbas.steps._get_eqoffsets:main"
